<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dock</title>
<meta name="description" content="Install and run open-source tools from GitHub on your phone.">
<meta name="theme-color" content="#0a0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dock">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <main id="views">

    <section class="view active" id="view-dock" aria-label="Dock">
      <div class="scroll">
        <header class="hero">
          <div>
            <p class="eyebrow" id="greeting">Your tools</p>
            <h1>Dock</h1>
          </div>
          <button class="pill" id="vm-pill" type="button" aria-live="polite">
            <span class="dot"></span><span id="vm-pill-text">Starting</span>
          </button>
        </header>

        <form class="addbar" id="add-form" autocomplete="off" novalidate>
          <svg class="addbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49l-.01-1.9c-2.78.62-3.37-1.21-3.37-1.21-.46-1.19-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.35 1.12 2.92.85.09-.66.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9l-.01 2.81c0 .27.18.6.69.49A10.2 10.2 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"/></svg>
          <input id="add-input" type="url" inputmode="url" enterkeyhint="go" placeholder="Paste a GitHub link" aria-label="GitHub repository link" spellcheck="false" autocapitalize="off" autocorrect="off">
          <button type="button" class="addbar-paste" id="add-paste">Paste</button>
          <button type="submit" class="addbar-go" aria-label="Read repository">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>

        <div class="section-head" id="apps-head" hidden>
          <h2>Installed</h2>
          <span class="muted" id="apps-count"></span>
        </div>
        <div class="grid" id="grid"></div>

        <div class="empty" id="empty" hidden>
          <div class="empty-art" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <h2>Nothing installed yet</h2>
          <p>Paste a GitHub link above. Dock reads the repository, works out how to install it, and runs it in a private Linux on this phone.</p>
          <p class="muted small">Try one of these</p>
          <div class="chips" id="suggestions"></div>
        </div>

        <button class="storage-card" id="storage-card" type="button">
          <div class="ring" id="storage-ring"><span id="storage-ring-text"></span></div>
          <div class="storage-text">
            <strong id="storage-title">Storage</strong>
            <span class="muted" id="storage-sub"></span>
          </div>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>

    <section class="view" id="view-terminal" aria-label="Terminal">
      <div class="term-head">
        <div class="term-tabs" id="term-tabs"></div>
        <button class="icon-btn" id="term-new" type="button" aria-label="New terminal">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="term-stack" id="term-stack">
        <div class="term-empty" id="term-empty">
          <p id="term-empty-text">Linux is starting…</p>
        </div>
      </div>
      <div class="keybar" id="keybar" role="toolbar" aria-label="Extra keys"></div>
    </section>

    <section class="view" id="view-settings" aria-label="Settings">
      <div class="scroll" id="settings-body"></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button type="button" class="tab active" data-view="dock">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2.2"/></svg>
      <span>Dock</span>
    </button>
    <button type="button" class="tab" data-view="terminal">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="16" rx="3.5"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15H17" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Terminal</span>
    </button>
    <button type="button" class="tab" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9m4 0h3M4 17h3m4 0h9" stroke-linecap="round"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
